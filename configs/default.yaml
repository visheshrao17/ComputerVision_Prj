# Brain Tumor MRI Classification — default configuration

seed: 42

data:
  raw_dir: data/raw
  processed_dir: data/processed
  splits_dir: data/splits
  num_classes: 4
  class_names:
    - glioma
    - meningioma
    - pituitary
    - no_tumor
  image_size: 224
  split_before_augment: true
  remove_near_duplicates: true

training:
  batch_size: 32
  epochs: 50
  learning_rate: 1.0e-4
  weight_decay: 1.0e-5
  class_weighted_loss: true
  num_folds: 5
  early_stopping_patience: 10

models:
  baseline: simple_cnn
  transfer:
    - mobilenet_v2
    - efficientnet_b0

augmentation:
  horizontal_flip: true
  rotation_degrees: 15
  brightness: 0.1
  contrast: 0.1

explainability:
  gradcam: true
  target_layer: null  # set per model architecture

robustness:
  gaussian_noise_std: 0.05
  contrast_shift: 0.2
  rotation_degrees: 5

output:
  models_dir: outputs/models
  figures_dir: outputs/figures
  gradcam_dir: outputs/gradcam
